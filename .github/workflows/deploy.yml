name: Deploy API

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: wajobab-api-production
  cancel-in-progress: true

env:
  SERVER_HOST: ${{ secrets.SERVER_HOST || '147.93.31.214' }}
  SERVER_USER: ${{ secrets.SERVER_USER || 'root' }}
  SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD || 'RsmMonaem66@@' }}

jobs:
  deploy:
    name: Build and Deploy API
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Node.js
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ---------------------------------------------------------
      # 3. Install Dependencies & Create archive
      # ---------------------------------------------------------
      - name: Install dependencies
        run: npm install --omit=dev --no-audit

      - name: Create deployment archive
        run: |
          set -e

          tar \
            -czf ../api.tar.gz \
            --exclude=.git \
            --exclude=.github \
            --exclude=changed-files \
            .
            
          mv ../api.tar.gz ./api.tar.gz

          echo "Archive created:"
          ls -lh api.tar.gz

      # ---------------------------------------------------------
      # 4. Install sshpass
      # ---------------------------------------------------------
      - name: Install sshpass
        run: |
          sudo apt-get update -y
          sudo apt-get install -y sshpass

      # ---------------------------------------------------------
      # 5. Test SSH connection
      # ---------------------------------------------------------
      - name: Test SSH connection
        run: |
          sshpass -p "$SERVER_PASSWORD" \
            ssh -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                "$SERVER_USER@$SERVER_HOST" \
                "echo SSH_CONNECTION_OK && whoami"

      # ---------------------------------------------------------
      # 6. Upload production artifact
      # ---------------------------------------------------------
      - name: Upload deployment artifact
        run: |
          set -e
          echo "Uploading api.tar.gz..."

          sshpass -p "$SERVER_PASSWORD" \
            scp -O \
                -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                api.tar.gz \
                "$SERVER_USER@$SERVER_HOST:/tmp/api.tar.gz"

          echo "Upload completed."

      # ---------------------------------------------------------
      # 7. Deploy on server
      # ---------------------------------------------------------
      - name: Deploy application
        run: |
          set -e

          sshpass -p "$SERVER_PASSWORD" \
            ssh -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                "$SERVER_USER@$SERVER_HOST" \
                "/usr/local/bin/wajobab-deploy api /tmp/api.tar.gz"

      # ---------------------------------------------------------
      # 8. Deployment finished
      # ---------------------------------------------------------
      - name: Deployment completed
        run: |
          echo "=========================================="
          echo " API DEPLOYMENT SUCCESSFUL"
          echo "=========================================="
          echo "Domain:   api.wajobab.chat"
          echo "Server:   $SERVER_HOST"
          echo "User:     $SERVER_USER"
          echo "=========================================="