name: Deploy API

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: wajobab-api-production
  cancel-in-progress: true

jobs:
  build:
    name: Build API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare deployment package
        run: |
          mkdir -p deploy

          cp -r .next/standalone/. deploy/

          mkdir -p deploy/.next/static
          cp -r .next/static/. deploy/.next/static/

          if [ -d public ]; then
            cp -r public deploy/public
          fi

      - name: Create release archive
        run: |
          tar -czf api.tar.gz -C deploy .

      - name: Upload release
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "api.tar.gz"
          target: "/tmp"

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.2
        env:
          APP_NAME: wajobab-api
          APP_DIR: /home/wajobab.chat/public_html/api.wajobab.chat
          PORT: 3102
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: APP_NAME,APP_DIR,PORT
          script: |
            set -e

            RELEASE="$(date +%Y%m%d-%H%M%S)"

            mkdir -p "$APP_DIR/releases/$RELEASE"

            tar -xzf /tmp/api.tar.gz \
              -C "$APP_DIR/releases/$RELEASE"

            rm -f /tmp/api.tar.gz

            ln -sfn \
              "$APP_DIR/releases/$RELEASE" \
              "$APP_DIR/current"

            cd "$APP_DIR/current"

            if pm2 describe "$APP_NAME" >/dev/null 2>&1; then
              pm2 reload "$APP_NAME" --update-env
            else
              PORT="$PORT" \
              NODE_ENV=production \
              pm2 start server.js \
                --name "$APP_NAME"
            fi

            pm2 save

            echo "API deployed successfully"
