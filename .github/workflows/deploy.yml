name: Deploy API

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: wajobab-api-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy API
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Node.js
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ---------------------------------------------------------
      # 3. Install Dependencies & Create archive
      # ---------------------------------------------------------
      - name: Install dependencies
        run: npm install --omit=dev --no-audit

      - name: Create deployment archive
        run: |
          set -e

          tar \
            -czf ../api.tar.gz \
            --exclude=.git \
            --exclude=.github \
            --exclude=changed-files \
            .
            
          mv ../api.tar.gz ./api.tar.gz

          echo "Archive created:"
          ls -lh api.tar.gz

      # ---------------------------------------------------------
      # 4. Configure SSH
      # ---------------------------------------------------------
      - name: Configure SSH
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.ssh"

          printf '%s\n' \
            '${{ secrets.SERVER_SSH_KEY }}' \
            > "$HOME/.ssh/wajobab"

          chmod 600 "$HOME/.ssh/wajobab"

          echo "Validating SSH private key..."

          ssh-keygen \
            -y \
            -f "$HOME/.ssh/wajobab" \
            > /dev/null

          echo "Adding server to known_hosts..."

          ssh-keyscan \
            -H \
            '${{ secrets.SERVER_HOST }}' \
            >> "$HOME/.ssh/known_hosts"

          chmod 644 "$HOME/.ssh/known_hosts"

      # ---------------------------------------------------------
      # 5. Test SSH connection
      # ---------------------------------------------------------
      - name: Test SSH connection
        shell: bash
        run: |
          set -e

          ssh \
            -i "$HOME/.ssh/wajobab" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            '${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}' \
            "echo SSH_CONNECTION_OK && whoami"

      # ---------------------------------------------------------
      # 6. Upload production artifact
      # ---------------------------------------------------------
      - name: Upload deployment artifact
        shell: bash
        run: |
          set -e

          echo "Uploading api.tar.gz..."

          scp \
            -O \
            -i "$HOME/.ssh/wajobab" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            api.tar.gz \
            '${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/api.tar.gz'

          echo "Upload completed."

      # ---------------------------------------------------------
      # 7. Deploy on server
      # ---------------------------------------------------------
      - name: Deploy application
        shell: bash
        run: |
          set -e

          ssh \
            -i "$HOME/.ssh/wajobab" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            '${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}' \
            "echo '${{ secrets.SERVER_PASSWORD }}' | sudo -S /usr/local/bin/wajobab-deploy api /tmp/api.tar.gz"

      # ---------------------------------------------------------
      # 8. Deployment finished
      # ---------------------------------------------------------
      - name: Deployment completed
        run: |
          echo "=========================================="
          echo " API DEPLOYMENT SUCCESSFUL"
          echo "=========================================="
          echo "Domain:   api.wajobab.chat"
          echo "Server:   ${{ secrets.SERVER_HOST }}"
          echo "User:     ${{ secrets.SERVER_USER }}"
          echo "=========================================="