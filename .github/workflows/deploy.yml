name: Deploy API

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: wajobab-api-production
  cancel-in-progress: true

env:
  SERVER_HOST: ${{ secrets.SERVER_HOST || '147.93.31.214' }}
  SERVER_USER: ${{ secrets.SERVER_USER || 'root' }}
  SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD || 'RsmMonaem66@@' }}

jobs:
  deploy:
    name: Build and Deploy API
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Node.js
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ---------------------------------------------------------
      # 3. Install Dependencies & Create archive
      # ---------------------------------------------------------
      - name: Install dependencies
        run: npm install --omit=dev --no-audit --ignore-scripts

      - name: Create deployment archive
        run: |
          set -e

          tar \
            -czf ../api.tar.gz \
            --exclude=.git \
            --exclude=.github \
            --exclude=changed-files \
            .
            
          mv ../api.tar.gz ./api.tar.gz

          echo "Archive created:"
          ls -lh api.tar.gz

      # ---------------------------------------------------------
      # 4. Setup SSH (Key or Password)
      # ---------------------------------------------------------
      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -e
          sudo apt-get update -y && sudo apt-get install -y sshpass
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          if [ -n "$SSH_KEY" ]; then
            printf "%s\n" "$SSH_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            echo "HAS_KEY=true" >> $GITHUB_ENV
          else
            echo "HAS_KEY=false" >> $GITHUB_ENV
          fi

      # ---------------------------------------------------------
      # 5. Test SSH connection
      # ---------------------------------------------------------
      - name: Test SSH connection
        run: |
          set -e
          if [ "$HAS_KEY" = "true" ] && ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=8 "$SERVER_USER@$SERVER_HOST" "echo SSH_KEY_OK"; then
            echo "AUTH_MODE=key" >> $GITHUB_ENV
            echo "SSH authenticated successfully using SSH Key!"
          elif sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=8 "$SERVER_USER@$SERVER_HOST" "echo SSH_PASS_OK"; then
            echo "AUTH_MODE=password" >> $GITHUB_ENV
            echo "SSH authenticated successfully using Password!"
          else
            echo "::error::Both SSH Key and Password authentication failed!"
            exit 1
          fi

      # ---------------------------------------------------------
      # 6. Upload production artifact
      # ---------------------------------------------------------
      - name: Upload deployment artifact
        run: |
          set -e
          echo "Uploading api.tar.gz..."
          if [ "$AUTH_MODE" = "key" ]; then
            scp -i ~/.ssh/deploy_key -O -o StrictHostKeyChecking=no api.tar.gz "$SERVER_USER@$SERVER_HOST:/tmp/api.tar.gz"
          else
            sshpass -p "$SERVER_PASSWORD" scp -O -o StrictHostKeyChecking=no api.tar.gz "$SERVER_USER@$SERVER_HOST:/tmp/api.tar.gz"
          fi
          echo "Upload completed."

      # ---------------------------------------------------------
      # 7. Deploy on server
      # ---------------------------------------------------------
      - name: Deploy application
        run: |
          set -e
          if [ "$AUTH_MODE" = "key" ]; then
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" "/usr/local/bin/wajobab-deploy api /tmp/api.tar.gz"
          else
            sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" "/usr/local/bin/wajobab-deploy api /tmp/api.tar.gz"
          fi

      # ---------------------------------------------------------
      # 8. Deployment finished
      # ---------------------------------------------------------
      - name: Deployment completed
        run: |
          echo "=========================================="
          echo " API DEPLOYMENT SUCCESSFUL"
          echo "=========================================="
          echo "Domain:   api.wajobab.chat"
          echo "Server:   $SERVER_HOST"
          echo "User:     $SERVER_USER"
          echo "=========================================="